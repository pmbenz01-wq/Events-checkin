<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
doc-page:not(:defined){visibility:hidden}
body{font-family:Anuphan,system-ui,sans-serif;color:#17150f}
a{color:#d8482b}a:hover{color:#b13a22}
</style>
<script src="./doc-page.js"></script>
</helmet>

<doc-page width="105mm" height="148mm" margin="0">
<sc-for list="{{ badges }}" as="b" hint-placeholder-count="2">
<section class="page" style="width:105mm;height:148mm;display:flex;flex-direction:column;background:{{ paper }};color:{{ ink }};overflow:hidden">

<div style="height:13mm;background:{{ accent }};display:grid;place-items:center;flex:none">
<div style="width:16mm;height:3.4mm;border-radius:99px;background:rgba(255,255,255,.6)"></div>
</div>

<div style="flex:1;padding:8mm 8mm 0;display:flex;flex-direction:column;min-height:0">
<div style="font:500 8pt IBM Plex Mono,monospace;letter-spacing:.16em;color:{{ label }};white-space:nowrap">{{ b.event }}</div>
<div style="font:600 25pt/1.02 Anuphan,sans-serif;letter-spacing:-.03em;margin-top:7mm;text-wrap:balance">{{ b.name }}</div>
<div style="font:400 10.5pt/1.4 Anuphan,sans-serif;color:{{ muted }};margin-top:3.5mm">{{ b.org }}</div>
<div style="margin-top:auto;padding-bottom:5mm;font:600 13pt/1 Anuphan,sans-serif;color:{{ accent }};letter-spacing:-.01em;white-space:nowrap">{{ b.type }}</div>
</div>

<div style="background:{{ footBg }};color:{{ footInk }};padding:5.5mm 8mm;display:flex;align-items:center;gap:5mm;flex:none">
<div style="width:20mm;height:20mm;background:{{ qrPaper }};color:{{ qrInk }};padding:1mm;flex:none">{{ b.qr }}</div>
<div style="font:500 8pt/1.75 IBM Plex Mono,monospace;letter-spacing:.04em;white-space:nowrap">{{ b.code }}<br>{{ b.gate }}<br>{{ b.date }}</div>
</div>

</section>
</sc-for>
</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;editorial&quot;,&quot;brass&quot;,&quot;onyx&quot;,&quot;forest&quot;,&quot;ink&quot;],&quot;default&quot;:&quot;editorial&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;ธีมสีของงาน&quot;},&quot;eventName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ThinkTech Summit 2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;ธีมสีของงาน&quot;}}">
class Component extends DCLogic {
  qr(seedStr, n) {
    let h = 2166136261;
    for (let i = 0; i < seedStr.length; i++) { h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }
    const rnd = (a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(h);
    const g = Array.from({ length: n }, () => new Array(n).fill(0));
    const inFinder = (x, y) => (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!inFinder(x, y)) g[y][x] = rnd() < 0.47 ? 1 : 0;
    for (let i = 8; i < n - 8; i++) { g[6][i] = i % 2 ? 0 : 1; g[i][6] = i % 2 ? 0 : 1; }
    const finder = (ox, oy) => { for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) { const ring = x === 0 || y === 0 || x === 6 || y === 6, core = x >= 2 && x <= 4 && y >= 2 && y <= 4; g[oy + y][ox + x] = ring || core ? 1 : 0; } };
    finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
    for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) { const ring = x === 0 || y === 0 || x === 4 || y === 4; g[n - 9 + y][n - 9 + x] = ring || (x === 2 && y === 2) ? 1 : 0; }
    let d = "";
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (g[y][x]) d += `M${x},${y}h1v1h-1Z`;
    return React.createElement("svg", { viewBox: `-2 -2 ${n + 4} ${n + 4}`, width: "100%", height: "100%", shapeRendering: "crispEdges", style: { display: "block" } }, React.createElement("path", { d, fill: "currentColor" }));
  }

  renderVals() {
    const THEMES = {
      editorial: { paper: "#f4f1e6", ink: "#17150f", accent: "#d8482b", muted: "#7d7767", label: "#8a8474", footBg: "#17150f", footInk: "#f4f1e6" },
      brass: { paper: "#f8f6f1", ink: "#191713", accent: "#a8874f", muted: "#8c8474", label: "#a39a89", footBg: "#191713", footInk: "#f8f6f1" },
      onyx: { paper: "#1a1815", ink: "#f0ece3", accent: "#c9ac74", muted: "#8b8578", label: "#6f6a5f", footBg: "#f0ece3", footInk: "#1a1815", qrPaper: "#f0ece3", qrInk: "#1a1815" },
      forest: { paper: "#f1f4f0", ink: "#13201a", accent: "#2f6b4f", muted: "#5f7268", label: "#82988d", footBg: "#13201a", footInk: "#f1f4f0" },
      ink: { paper: "#eef0f4", ink: "#141a24", accent: "#2f4d8c", muted: "#5c6675", label: "#8b93a1", footBg: "#141a24", footInk: "#eef0f4" }
    };
    const th = THEMES[this.props.theme] || THEMES.editorial;
    const rows = [
      { name: "ณัฐพงษ์ สุวรรณเลิศ", org: "บริษัท คอร์ปเทค จำกัด", type: "ทั่วไป · GENERAL", code: "TT26-4F2A-901" },
      { name: "พิมพ์ชนก วราภรณ์", org: "สยามดิจิทัล กรุ๊ป", type: "VIP", code: "TT26-51C7-902" },
      { name: "กิตติภพ ธนะโชติ", org: "โอเชียนเวิร์คส์", type: "สื่อ · PRESS", code: "TT26-6A3B-903" }
    ];
    return {
      paper: th.paper, ink: th.ink, accent: th.accent, muted: th.muted, label: th.label,
      footBg: th.footBg, footInk: th.footInk,
      qrPaper: th.qrPaper || "#ffffff", qrInk: th.qrInk || "#0d0c0a",
      badges: rows.map(r => ({
        ...r,
        event: (this.props.eventName || "ThinkTech Summit 2026").toUpperCase(),
        gate: "HALL 2 · GATE A",
        date: "18.12.2026",
        qr: this.qr(r.code, 25)
      }))
    };
  }
}
</script>
</body>
</html>
